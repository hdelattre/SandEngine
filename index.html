<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandengine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__bar" role="toolbar" aria-label="Toolbar">
        <div class="topbar__left">
          <span class="brand">sandengine</span>
          <span class="status" id="status"></span>
        </div>
        <div class="topbar__actions">
          <div class="segmented" role="group" aria-label="Simulation">
            <button id="playPauseBtn" type="button">Pause</button>
            <button id="stepBtn" type="button">Step</button>
            <button id="clearBtn" type="button">Clear</button>
          </div>
          <label class="control control--select control--particle">
            <span>Particle</span>
            <select id="particleSelect"></select>
          </label>
          <button id="settingsBtn" type="button" aria-controls="settingsPanel" aria-expanded="false">Menu</button>
        </div>
      </div>

      <div class="topbar__panel" id="settingsPanel" role="region" aria-label="Settings" hidden>
        <div class="panelGrid">
          <label class="control control--select">
            <span>Level</span>
            <select id="levelSelect"></select>
          </label>
          <label class="control control--toggle">
            <span>Add</span>
            <input id="addMode" class="toggle" type="checkbox" />
          </label>
          <label class="control control--range">
            <span>Brush</span>
            <input id="brushSize" type="range" min="1" max="30" value="8" />
            <output class="control__value" id="brushSizeValue">8</output>
          </label>
          <label class="control control--range">
            <span>Steps/frame</span>
            <input id="stepsPerFrame" type="range" min="1" max="6" value="1" />
            <output class="control__value" id="stepsPerFrameValue">1</output>
          </label>
          <label class="control control--range">
            <span>Zoom</span>
            <input id="zoom" type="range" min="1" max="8" step="0.1" value="1" />
            <output class="control__value" id="zoomValue">1×</output>
          </label>
          <label class="control control--select">
            <span>View</span>
            <select id="viewSelect">
              <option value="material" selected>Material</option>
              <option value="temperature">Temperature</option>
            </select>
          </label>
          <label class="control control--select">
            <span>Res</span>
            <select id="resSelect">
              <option value="256x144">256×144</option>
              <option value="384x216">384×216</option>
              <option value="512x288">512×288</option>
              <option value="768x432" selected>768×432</option>
              <option value="1024x576">1024×576</option>
              <option value="1280x720">1280×720</option>
              <option value="1536x864">1536×864</option>
            </select>
          </label>
          <div class="panelGroup panelGroup--paste">
            <label class="control control--toggle">
              <span>Edges→Stone</span>
              <input id="pasteEdgeStone" class="toggle" type="checkbox" checked />
            </label>
            <button id="pasteBtn" type="button">Paste</button>
          </div>
          <div class="panelGroup panelGroup--stamp">
            <label class="control control--toggle">
              <span>Stamp</span>
              <input id="stampMode" class="toggle" type="checkbox" />
            </label>
            <label class="control control--stampSize">
              <span>W</span>
              <input id="stampW" type="number" min="1" step="1" inputmode="numeric" />
            </label>
            <label class="control control--stampSize">
              <span>H</span>
              <input id="stampH" type="number" min="1" step="1" inputmode="numeric" />
            </label>
            <label class="control control--toggle">
              <span>Lock</span>
              <input id="stampLock" class="toggle" type="checkbox" checked />
            </label>
            <button id="stampClearBtn" type="button">Clear stamp</button>
          </div>
        </div>
        <div class="panelHints" aria-label="Hints">
          <div class="hint__small" id="hintStatus"></div>
          <div class="hint__small" id="levelHint"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <canvas id="canvas"></canvas>
      <canvas id="cursorCanvas"></canvas>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
