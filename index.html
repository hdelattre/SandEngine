<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandengine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__bar" role="toolbar" aria-label="Toolbar">
        <div class="topbar__left">
          <span class="status" id="status"></span>
          <span class="status" id="hintStatus"></span>
        </div>
        <div class="topbar__actions">
          <div class="topbar__row topbar__row--primary" aria-label="Simulation and menu">
            <div class="segmented" role="group" aria-label="Tool">
              <button id="toolPaintBtn" type="button" aria-pressed="true">Paint</button>
              <button id="toolStampBtn" type="button" aria-pressed="false">Stamp</button>
            </div>
            <div class="segmented" role="group" aria-label="Simulation">
              <button id="playPauseBtn" type="button">Pause</button>
              <button id="stepBtn" type="button">Step</button>
              <button id="clearBtn" type="button">Clear</button>
            </div>
            <button id="settingsBtn" type="button" aria-controls="settingsPanel" aria-expanded="false">Menu</button>
          </div>
          <div class="topbar__row topbar__row--secondary" aria-label="Tools">
            <div class="hotbar" role="group" aria-label="Particles">
              <div id="particleHotbar" class="hotbar__items"></div>
              <button id="particleMoreBtn" class="hotbar__more" type="button">More</button>
              <label class="hotbar__toggle" title="Edges → Stone">
                <input id="pasteEdgeStone" class="toggle toggle--mini" type="checkbox" checked aria-label="Edges to stone" />
              </label>
            </div>
            <label id="brushControl" class="control control--range control--brush">
              <span>Brush</span>
              <input id="brushSize" type="range" min="1" max="30" value="8" />
              <output class="control__value" id="brushSizeValue">8</output>
            </label>
            <div id="stampControls" class="stampControls" hidden>
              <label class="control control--stampSize">
                <span>W</span>
                <input id="stampW" type="number" min="1" step="1" inputmode="numeric" />
              </label>
              <label class="control control--stampSize">
                <span>H</span>
                <input id="stampH" type="number" min="1" step="1" inputmode="numeric" />
              </label>
              <label class="stampControls__toggle" title="Lock aspect">
                <input id="stampLock" class="toggle toggle--mini" type="checkbox" checked aria-label="Lock aspect" />
              </label>
            </div>
          </div>
        </div>
      </div>

      <div id="particlePicker" class="modal" role="dialog" aria-modal="true" aria-label="Particle picker" hidden>
        <div class="modal__card">
          <div class="modal__header">
            <input id="particleSearch" class="modal__search" type="search" placeholder="Search particles…" autocomplete="off" />
            <button id="particlePickerCloseBtn" type="button">Close</button>
          </div>
          <div id="particleGrid" class="particleGrid" role="listbox" aria-label="All particles"></div>
        </div>
      </div>

      <div class="topbar__panel" id="settingsPanel" role="region" aria-label="Settings" hidden>
        <div class="panelGrid">
          <label class="control control--select">
            <span>Level</span>
            <select id="levelSelect"></select>
          </label>
          <label class="control control--select">
            <span>Particle</span>
            <select id="particleSelect"></select>
          </label>
          <input id="stampMode" type="checkbox" hidden />
          <label class="control control--toggle">
            <span>Add</span>
            <input id="addMode" class="toggle" type="checkbox" />
          </label>
          <label class="control control--select">
            <span>Rate</span>
            <select id="rateMode">
              <option value="sps" selected>Per second</option>
              <option value="spf">Per frame</option>
            </select>
          </label>
          <label class="control control--range">
            <span id="simRateLabel">Steps/sec</span>
            <input id="simRate" type="range" min="0" max="1000" step="1" value="60" />
            <output class="control__value" id="simRateValue">60/s (~1.0/f)</output>
          </label>
          <label class="control control--range">
            <span>Zoom</span>
            <input id="zoom" type="range" min="1" max="8" step="0.1" value="1" />
            <output class="control__value" id="zoomValue">1×</output>
          </label>
          <label class="control control--select">
            <span>View</span>
            <select id="viewSelect">
              <option value="material" selected>Material</option>
              <option value="temperature">Temperature</option>
            </select>
          </label>
          <label class="control control--select">
            <span>Res</span>
            <select id="resSelect"></select>
          </label>
          <label id="golRateControl" class="control control--range" title="How often to apply the Game of Life pass">
            <span>GoL interval</span>
            <input id="golRate" type="range" min="1" max="32" step="1" value="1" />
            <output class="control__value" id="golRateValue">every tick</output>
          </label>
          <label class="control control--toggle" title="Run a Game of Life pass every tick">
            <span>Game of Life</span>
            <input id="golMode" class="toggle" type="checkbox" aria-label="Game of Life" />
          </label>
        </div>
        <div class="panelHints" aria-label="Hints">
          <div class="hint__small" id="levelHint"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <canvas id="canvas"></canvas>
      <canvas id="cursorCanvas"></canvas>
    </main>

    <div id="fatalOverlay" class="fatal" hidden>
      <div class="fatal__card" role="alert">
        <h1 id="fatalTitle">Unable to start</h1>
        <p id="fatalMessage"></p>
        <p class="fatal__small">This app requires WebGL2. Try enabling hardware acceleration or using a different browser.</p>
      </div>
    </div>

    <div id="loadingOverlay" class="loading" hidden>
      <div class="loading__card" role="status" aria-live="polite">
        <div class="loading__spinner" aria-hidden="true"></div>
        <div>
          <div class="loading__title">Loading…</div>
          <div class="loading__msg" id="loadingMessage">Compiling shaders</div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
