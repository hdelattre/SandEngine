<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandengine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__left">
        <span class="brand">sandengine</span>
        <span class="status" id="status"></span>
      </div>
      <div class="topbar__right">
        <button id="playPauseBtn" type="button">Pause</button>
        <button id="stepBtn" type="button">Step</button>
        <button id="clearBtn" type="button">Clear</button>
        <label class="control">
          <span>Level</span>
          <select id="levelSelect"></select>
        </label>
        <label class="control">
          <span>Particle</span>
          <select id="particleSelect"></select>
        </label>
        <label class="control">
          <span>Brush</span>
          <input id="brushSize" type="range" min="1" max="30" value="8" />
        </label>
        <label class="control">
          <span>Steps</span>
          <input id="stepsPerFrame" type="range" min="1" max="6" value="1" />
        </label>
        <label class="control">
          <span>View</span>
          <select id="viewSelect">
            <option value="material" selected>Material</option>
            <option value="temperature">Temperature</option>
          </select>
        </label>
        <label class="control">
          <span>Res</span>
          <select id="resSelect">
            <option value="256x144" selected>256×144</option>
            <option value="384x216">384×216</option>
            <option value="512x288">512×288</option>
            <option value="768x432">768×432</option>
          </select>
        </label>
      </div>
    </header>

    <main class="main">
      <canvas id="canvas"></canvas>
      <div class="hint" id="hint">
        <div><b>Draw</b>: left mouse / touch</div>
        <div><b>Erase</b>: right mouse / two-finger (or hold Shift)</div>
        <div><b>Pick</b>: middle-click (or Alt)</div>
        <div><b>Paste Image</b>: Ctrl/Cmd+V (Shift = no scale)</div>
        <div><b>Hotkeys</b>: Space pause • 1–0, -, = select • [ ] brush • T temp view</div>
        <div class="hint__small" id="hintStatus"></div>
        <div class="hint__small" id="levelHint"></div>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
